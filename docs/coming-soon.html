<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trailblazer Labs — Coming Soon</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #04050c;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Salesforce Sans", Arial, sans-serif;
  }
  canvas#sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 0 24px;
  }
  .content img {
    width: 220px;
    max-width: 70vw;
    filter: brightness(0) invert(1);
    opacity: 0.95;
    margin-bottom: 28px;
  }
  .content h1 {
    color: #FFFFFF;
    font-weight: 600;
    font-size: clamp(20px, 4vw, 32px);
    letter-spacing: 0.02em;
    text-shadow: 0 0 24px rgba(255,255,255,0.25);
  }
  .content p {
    color: rgba(255,255,255,0.55);
    font-size: 14px;
    margin-top: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="content">
    <img src="images/trailblazer-labs-wordmark.svg" alt="Trailblazer Labs">
    <h1>Something is taking shape.</h1>
    <p>Coming soon</p>
  </div>

  <script>
    const canvas = document.getElementById('sky');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      const count = Math.floor((w * h) / 3500);
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.3 + 0.3,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.015 + 0.005,
      }));
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      const t = performance.now() * 0.001;
      for (const s of stars) {
        const twinkle = 0.5 + 0.5 * Math.sin(t * s.speed * 40 + s.phase);
        ctx.globalAlpha = 0.25 + twinkle * 0.75;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    draw();
  </script>
</body>
</html>
